<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あんスタ ぱしゃっつ管理</title>
<style>
:root{--blue:#b9d5e8;--pale:#edf5fa;--line:#e1e5e9;--text:#414a52}
*{box-sizing:border-box}
body{margin:0;background:#f7f9fb;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:white;padding:18px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 5px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:12px 0 8px}
main{max-width:850px;margin:auto;padding:14px}
.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:13px}
button,select,input{font:inherit}
button{border:0;border-radius:9px;padding:10px 13px;background:var(--blue);color:#304b5c;font-weight:650}
button.sub{background:#eef1f3;color:#59636b}
button.danger{background:#f8e9e9;color:#a45c5c}
button.small{font-size:12px;padding:7px 9px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
select,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--text);margin:5px 0 10px}
input[type=file]{width:100%;margin:8px 0}
label{font-size:13px;font-weight:650;display:block;margin-top:8px}
.muted{font-size:12px;color:#89949d}
.item{border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0;background:white}
.item-title{font-weight:700}
.hidden{display:none!important}
.tag{display:inline-block;background:var(--pale);border-radius:20px;padding:4px 9px;font-size:11px;margin:3px}
.cardgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.goods{min-width:0;border:1px solid var(--line);border-radius:9px;padding:5px;background:white;text-align:center}
.goods img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#f1f3f5}
.edition{font-size:11px;font-weight:700;margin-top:5px;overflow-wrap:anywhere}
.count{font-size:12px;color:#6389a2;font-weight:700;margin-top:3px}
.character-block{margin:12px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.total{background:var(--pale);border-radius:9px;padding:10px;font-weight:700;margin:10px 0}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
nav button{flex:1;min-width:90px}
.cropbox{position:relative;width:min(100%,340px);aspect-ratio:1;margin:12px auto;background:#e9edf0;overflow:hidden;border-radius:10px;touch-action:none}
.cropbox canvas{width:100%;height:100%;display:block;touch-action:none}
.cropcontrols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cropcontrols label{font-size:12px}
.cropcontrols input{width:100%}
@media(max-width:360px){.cardgrid{gap:5px}.goods{padding:3px}.edition{font-size:10px}}
@media print{header,.no-print,.goods button{display:none!important}body{background:white}main{padding:0}.panel{border:0;padding:5px}}
</style>
</head>
<body>
<header>
<h1>あんスタ ぱしゃっつ管理</h1>
<div class="muted">事務所・ユニット・キャラクター別に管理</div>
</header>
<main>
<nav class="no-print">
<button onclick="showPage('manage')">グッズ管理</button>
<button onclick="showPage('shot')">スクショ表示</button>
<button onclick="showPage('backup')">バックアップ</button>
</nav>
<div id="notice" class="muted">読み込み中…</div>

<section id="managePage">
<div class="panel">
<h2>事務所</h2><div id="officeList"></div>
<div class="actions"><button onclick="addOffice()">＋ 事務所を追加</button></div>
</div>
<div class="panel hidden" id="unitPanel">
<h2 id="unitHeading">ユニット</h2><div id="unitList"></div>
<div class="actions"><button onclick="addUnit()">＋ ユニットを追加</button><button class="sub" onclick="closePanel('unitPanel')">閉じる</button></div>
</div>
<div class="panel hidden" id="characterPanel">
<h2 id="characterHeading">キャラクター</h2><div id="characterList"></div>
<div class="actions"><button onclick="addCharacter()">＋ キャラクターを追加</button><button class="sub" onclick="closePanel('characterPanel')">閉じる</button></div>
</div>
<div class="panel hidden" id="goodsPanel">
<h2 id="goodsHeading">ぱしゃっつ</h2><div id="goodsList"></div>
<div class="actions"><button onclick="addGoods()">＋ ぱしゃっつを追加</button><button class="sub" onclick="closePanel('goodsPanel')">閉じる</button></div>
</div>
</section>

<section id="shotPage" class="hidden">
<div class="panel no-print">
<h2>スクショ表示</h2>
<label>事務所</label><select id="shotOffice" onchange="loadShotUnits()"></select>
<label>ユニット</label><select id="shotUnit" onchange="renderShot()"></select>
<div class="actions"><button onclick="window.print()">印刷・PDF保存</button></div>
<p class="muted">スマホではこの画面をそのままスクリーンショットしてね。</p>
</div>
<div class="panel" id="shotResult"><p class="muted">事務所とユニットを選択してね。</p></div>
</section>

<section id="backupPage" class="hidden">
<div class="panel">
<h2>バックアップ・復元</h2>
<p class="muted">写真・枚数・事務所などをまとめて保存するよ。定期的にバックアップしてね。</p>
<div class="actions"><button onclick="exportBackup()">バックアップを保存</button></div>
<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
<label>バックアップファイルから復元</label>
<input type="file" id="backupFile" accept=".json,application/json">
<button class="sub" onclick="importBackup()">復元する</button>
<p class="muted">復元すると現在のデータはバックアップ内容に置き換わるよ。</p>
</div>
</section>
</main>

<div id="cropModal" class="hidden" style="position:fixed;inset:0;background:#0009;z-index:20;overflow:auto;padding:18px">
<div class="panel" style="max-width:420px;margin:20px auto">
<h2>写真をトリミング</h2>
<p class="muted">写真をドラッグして位置を調整。拡大・縮小もできるよ。</p>
<div class="cropbox"><canvas id="cropCanvas" width="600" height="600"></canvas></div>
<div class="cropcontrols">
<label>拡大・縮小<input id="cropZoom" type="range" min="1" max="3" step=".01" value="1"></label>
<label>明るさ<input id="cropBright" type="range" min="60" max="140" value="100"></label>
</div>
<div class="actions">
<button onclick="saveCroppedImage()">この写真で登録</button>
<button class="sub" onclick="cancelCrop()">キャンセル</button>
</div>
</div>
</div>

<script>
const DB_NAME="PashatsManagerDB",STORE="appData";
let db,data={offices:[],customEditions:[]};
let selectedOffice=null,selectedUnit=null,selectedCharacter=null;
let cropImage=null,cropTarget=null,cropX=0,cropY=0,dragX=0,dragY=0,dragging=false;
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const editions=[
["Vol.1",[]],
["Vol.2",["Private","Action"]],
["7周年",[]],
["SHUFFLE",[]],
["Vol.3",[]],
["COVER SONG",[]],
["Vol.4",[]],
["Vol.5",[]],
["Vol.6",["Private","Action"]],
["debut collection",[]],
["debut collection-2",[]],
["10 UNIT SONG",[]],
["Vol.7",["Action"]],
["その他",[]]
];

function openDB(){
return new Promise((resolve,reject)=>{
const r=indexedDB.open(DB_NAME,1);
r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}
function save(){
return new Promise((resolve,reject)=>{
const tx=db.transaction(STORE,"readwrite");
tx.objectStore(STORE).put(data,"main");
tx.oncomplete=()=>{$("notice").textContent="保存しました ✓";resolve()};
tx.onerror=()=>reject(tx.error);
});
}
function load(){
return new Promise((resolve,reject)=>{
const r=db.transaction(STORE).objectStore(STORE).get("main");
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}
function office(){return data.offices.find(x=>x.id===selectedOffice)}
function unit(){return office()?.units.find(x=>x.id===selectedUnit)}
function character(){return unit()?.characters.find(x=>x.id===selectedCharacter)}
function showPage(p){
["manage","shot","backup"].forEach(x=>$(x+"Page").classList.toggle("hidden",x!==p));
if(p==="shot")initShot();
}
function closePanel(id){$(id).classList.add("hidden")}

function addOffice(){
const n=prompt("事務所名を入力してね");
if(!n?.trim())return;
data.offices.push({id:uid(),name:n.trim(),units:[]});
save().then(renderOffices);
}
function addUnit(){
const n=prompt("ユニット名を入力してね");
if(!n?.trim())return;
office().units.push({id:uid(),name:n.trim(),characters:[]});
save().then(renderUnits);
}
function addCharacter(){
const n=prompt("キャラクター名を入力してね");
if(!n?.trim())return;
unit().characters.push({id:uid(),name:n.trim(),cards:[]});
save().then(renderCharacters);
}
function renameItem(t,id){
let a=t==="office"?data.offices.find(x=>x.id===id):t==="unit"?office().units.find(x=>x.id===id):unit().characters.find(x=>x.id===id);
if(!a)return;
const n=prompt("新しい名前",a.name);
if(n?.trim()){a.name=n.trim();save().then(renderAll)}
}
function deleteItem(t,id){
if(!confirm("この項目と中の登録内容を削除する？"))return;
if(t==="office")data.offices=data.offices.filter(x=>x.id!==id);
if(t==="unit")office().units=office().units.filter(x=>x.id!==id);
if(t==="character")unit().characters=unit().characters.filter(x=>x.id!==id);
if(t==="office")selectedOffice=selectedUnit=selectedCharacter=null;
if(t==="unit")selectedUnit=selectedCharacter=null;
if(t==="character")selectedCharacter=null;
save().then(renderAll);
}
function renderOffices(){
$("officeList").innerHTML=data.offices.length?data.offices.map(o=>`
<div class="item"><div class="item-title">${esc(o.name)}</div>
<div class="actions">
<button class="small" onclick="selectOffice('${o.id}')">ユニットを見る</button>
<button class="small sub" onclick="renameItem('office','${o.id}')">名前変更</button>
<button class="small danger" onclick="deleteItem('office','${o.id}')">削除</button>
</div></div>`).join(""):"<p class='muted'>事務所を追加してね。</p>";
}
function selectOffice(id){
selectedOffice=id;selectedUnit=selectedCharacter=null;
$("unitPanel").classList.remove("hidden");
$("characterPanel").classList.add("hidden");
$("goodsPanel").classList.add("hidden");
renderUnits();
}
function renderUnits(){
const o=office();if(!o)return;
$("unitHeading").textContent=o.name+" / ユニット";
$("unitList").innerHTML=o.units.length?o.units.map(u=>`
<div class="item"><div class="item-title">${esc(u.name)}</div>
<div class="actions">
<button class="small" onclick="selectUnit('${u.id}')">キャラクターを見る</button>
<button class="small sub" onclick="renameItem('unit','${u.id}')">名前変更</button>
<button class="small danger" onclick="deleteItem('unit','${u.id}')">削除</button>
</div></div>`).join(""):"<p class='muted'>ユニットを追加してね。</p>";
}
function selectUnit(id){
selectedUnit=id;selectedCharacter=null;
$("characterPanel").classList.remove("hidden");
$("goodsPanel").classList.add("hidden");
renderCharacters();
}
function renderCharacters(){
const u=unit();if(!u)return;
$("characterHeading").textContent=u.name+" / キャラクター";
$("characterList").innerHTML=u.characters.length?u.characters.map(c=>`
<div class="item"><div class="item-title">${esc(c.name)}</div>
<div class="muted">${c.cards.length}種類登録</div>
<div class="actions">
<button class="small" onclick="selectCharacter('${c.id}')">ぱしゃっつを見る</button>
<button class="small sub" onclick="renameItem('character','${c.id}')">名前変更</button>
<button class="small danger" onclick="deleteItem('character','${c.id}')">削除</button>
</div></div>`).join(""):"<p class='muted'>キャラクターを追加してね。</p>";
}
function selectCharacter(id){
selectedCharacter=id;
$("goodsPanel").classList.remove("hidden");
renderGoods();
}

function options(){
let a=[];
editions.forEach(([n,v])=>{
if(n==="その他")a.push({value:"その他",label:"その他"});
else if(v.length)v.forEach(x=>a.push({value:n+"｜"+x,label:n+"（"+x+"）"}));
else a.push({value:n,label:n});
});
(data.customEditions||[]).forEach(x=>{
if(!a.some(y=>y.value===x))a.push({value:x,label:x});
});
return a;
}
function rank(s){
const i=options().findIndex(x=>x.value===s);
return i<0?999:i;
}
function renderGoods(){
const c=character();if(!c)return;
$("goodsHeading").textContent=c.name+" / ぱしゃっつ";
$("goodsList").innerHTML=c.cards.length?[...c.cards].sort((a,b)=>rank(a.edition)-rank(b.edition)).map(x=>`
<div class="item" style="display:flex;gap:10px;align-items:center">
<img src="${x.image}" style="width:65px;height:65px;object-fit:cover;border-radius:7px">
<div style="flex:1;min-width:0">
<div class="item-title">${esc(x.edition)}</div>
<div class="muted">迷子枚数：${x.count}枚</div>
<div class="actions">
<button class="small sub" onclick="editCard('${x.id}')">編集</button>
<button class="small danger" onclick="deleteCard('${x.id}')">削除</button>
</div></div></div>`).join(""):"<p class='muted'>まだ登録がないよ。下のボタンから追加してね。</p>";
}

function addGoods(){
const wrap=document.createElement("div");
wrap.className="panel";
wrap.innerHTML=`
<h3>ぱしゃっつを登録</h3>
<label>種類</label>
<select id="ed">${options().map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join("")}</select>
<div id="otherBox" class="hidden">
<label>その他の種類名</label>
<input id="otherName" type="text" placeholder="例：8周年">
</div>
<label>迷子枚数</label><input id="cnt" type="number" min="0" value="1">
<label>写真</label><input id="photo" type="file" accept="image/*">
<div class="actions">
<button id="goCrop">写真を選んでトリミング</button>
<button class="sub" id="cancelAdd">キャンセル</button>
</div>`;
$("goodsList").prepend(wrap);
const sel=wrap.querySelector("#ed");
sel.onchange=()=>wrap.querySelector("#otherBox").classList.toggle("hidden",sel.value!=="その他");
wrap.querySelector("#cancelAdd").onclick=()=>wrap.remove();
wrap.querySelector("#goCrop").onclick=()=>{
const f=wrap.querySelector("#photo").files[0];
if(!f){alert("写真を選んでね");return}
let ed=sel.value;
if(ed==="その他"){
ed=wrap.querySelector("#otherName").value.trim();
if(!ed){alert("種類名を入力してね");return}
if(!data.customEditions.includes(ed))data.customEditions.push(ed);
}
cropTarget={wrap,edition:ed,count:Math.max(0,parseInt(wrap.querySelector("#cnt").value)||0)};
openCrop(f);
};
}

function openCrop(file){
const reader=new FileReader();
reader.onload=()=>{
const img=new Image();
img.onload=()=>{
cropImage=img;cropX=0;cropY=0;
$("cropZoom").value=1;$("cropBright").value=100;
$("cropModal").classList.remove("hidden");drawCrop();
};
img.onerror=()=>alert("この写真を読み込めなかったよ。別の画像で試してね。");
img.src=reader.result;
};
reader.onerror=()=>alert("写真ファイルを読み込めなかったよ");
reader.readAsDataURL(file);
}
function drawCrop(){
if(!cropImage)return;
const c=$("cropCanvas"),ctx=c.getContext("2d");
const z=Number($("cropZoom").value);
const base=600/Math.min(cropImage.width,cropImage.height);
const w=cropImage.width*base*z,h=cropImage.height*base*z;
ctx.clearRect(0,0,600,600);
ctx.filter="brightness("+$("cropBright").value+"%)";
ctx.drawImage(cropImage,(600-w)/2+cropX,(600-h)/2+cropY,w,h);
ctx.filter="none";
}
$("cropZoom").oninput=drawCrop;
$("cropBright").oninput=drawCrop;
$("cropCanvas").addEventListener("pointerdown",e=>{
dragging=true;dragX=e.clientX;dragY=e.clientY;
$("cropCanvas").setPointerCapture(e.pointerId);
});
$("cropCanvas").addEventListener("pointermove",e=>{
if(!dragging)return;
const r=$("cropCanvas").getBoundingClientRect();
cropX+=(e.clientX-dragX)*600/r.width;
cropY+=(e.clientY-dragY)*600/r.height;
dragX=e.clientX;dragY=e.clientY;drawCrop();
});
$("cropCanvas").addEventListener("pointerup",()=>dragging=false);
$("cropCanvas").addEventListener("pointercancel",()=>dragging=false);
function cancelCrop(){
$("cropModal").classList.add("hidden");cropImage=null;cropTarget=null;
}
async function saveCroppedImage(){
if(!cropImage||!cropTarget)return;
const c=$("cropCanvas"),small=document.createElement("canvas");
small.width=450;small.height=450;
small.getContext("2d").drawImage(c,0,0,600,600,0,0,450,450);
const image=small.toDataURL("image/jpeg",.78);
const ch=character();
ch.cards.push({id:uid(),edition:cropTarget.edition,count:cropTarget.count,image});
try{
await save();cropTarget.wrap.remove();cancelCrop();renderGoods();
}catch(e){alert("保存できなかったよ。写真を小さくして再度試してね。")}
}
function editCard(id){
const c=character(),x=c.cards.find(a=>a.id===id);if(!x)return;
const n=prompt("迷子枚数",x.count);if(n===null)return;
x.count=Math.max(0,parseInt(n)||0);
const e=prompt("種類名（変更しない場合はそのまま）",x.edition);
if(e?.trim())x.edition=e.trim();
save().then(renderGoods);
}
function deleteCard(id){
if(!confirm("このぱしゃっつを削除する？"))return;
character().cards=character().cards.filter(x=>x.id!==id);
save().then(renderGoods);
}

function initShot(){
$("shotOffice").innerHTML=data.offices.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("");
loadShotUnits();
}
function loadShotUnits(){
const o=data.offices.find(x=>x.id===$("shotOffice").value);
$("shotUnit").innerHTML=(o?.units||[]).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("");
renderShot();
}
function renderShot(){
const o=data.offices.find(x=>x.id===$("shotOffice").value);
const u=o?.units.find(x=>x.id===$("shotUnit").value);
const el=$("shotResult");
if(!u){el.innerHTML="<p class='muted'>ユニットを選択してね。</p>";return}
let total=0,html=`<h2>${esc(u.name)}</h2>`;
u.characters.forEach(c=>{
const cards=[...c.cards].filter(x=>x.count>0).sort((a,b)=>rank(a.edition)-rank(b.edition));
const sub=cards.reduce((s,x)=>s+x.count,0);total+=sub;
if(!cards.length)return;
html+=`<div class="character-block">
<h3>${esc(c.name)} <span class="tag">${sub}枚</span></h3>
<div class="cardgrid">${cards.map(x=>`
<div class="goods">
<img src="${x.image}">
<div class="edition">${esc(x.edition)}</div>
<div class="count">${x.count}枚</div>
</div>`).join("")}</div></div>`;
});
el.innerHTML=html+`<div class="total">ユニット合計：${total}枚</div>`;
}
function exportBackup(){
const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
const url=URL.createObjectURL(blob),a=document.createElement("a");
a.href=url;a.download="ぱしゃっつ管理バックアップ.json";a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importBackup(){
const f=$("backupFile").files[0];
if(!f){alert("バックアップファイルを選んでね");return}
if(!confirm("現在のデータを置き換えて復元するよ。続ける？"))return;
try{
const d=JSON.parse(await f.text());
if(!Array.isArray(d.offices))throw 0;
data=d;data.customEditions=data.customEditions||[];
await save();renderAll();alert("復元したよ！");
}catch(e){alert("ファイルを読み込めなかったよ")}
}
function renderAll(){
renderOffices();
if(selectedOffice&&office())renderUnits();
if(selectedUnit&&unit())renderCharacters();
if(selectedCharacter&&character())renderGoods();
}
(async()=>{
try{
db=await openDB();
const old=await load();
if(old&&Array.isArray(old.offices))data=old;
data.customEditions=data.customEditions||[];
data.offices.forEach(o=>{
o.units||=[];
o.units.forEach(u=>{
u.characters||=[];
u.characters.forEach(c=>c.cards||=[]);
});
});
renderAll();
$("notice").textContent="準備OK！前の登録データを引き継いだよ。";
}catch(e){
$("notice").textContent="保存機能を開始できなかったよ。Safariで開き直してね。";
console.error(e);
}
})();
</script>
</body>
</html>
