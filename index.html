
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あんスタ ぱしゃっつ管理</title>

<style>
:root{
  --blue:#b9d5e8;
  --pale:#edf5fa;
  --line:#e1e5e9;
  --text:#414a52;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#f7f9fb;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
header{
  background:white;
  padding:15px 16px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:5;
}
h1{font-size:20px;margin:0 0 5px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:12px 0 8px}
main{max-width:850px;margin:auto;padding:14px}
.panel{
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:13px;
}
button,select,input{font:inherit}
button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:var(--blue);
  color:#304b5c;
  font-weight:650;
}
button.sub{background:#eef1f3;color:#59636b}
button.danger{background:#f8e9e9;color:#a45c5c}
button.small{font-size:12px;padding:7px 9px}
.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:9px;
}
select,input[type=text],input[type=number]{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px;
  background:white;
  color:var(--text);
  margin:5px 0 10px;
}
input[type=file]{width:100%;margin:8px 0}
label{
  font-size:13px;
  font-weight:650;
  display:block;
  margin-top:8px;
}
.muted{font-size:12px;color:#89949d}
.item{
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px;
  margin:8px 0;
  background:white;
}
.item-title{font-weight:700}
.hidden{display:none!important}
.tag{
  display:inline-block;
  background:var(--pale);
  border-radius:20px;
  padding:4px 9px;
  font-size:11px;
  margin:3px;
}
.total{
  background:var(--pale);
  border-radius:9px;
  padding:11px;
  font-weight:700;
  margin:10px 0;
}
.global-total{
  background:#edf5fa;
  border:1px solid #dceaf3;
  border-radius:11px;
  padding:11px;
  margin-bottom:13px;
  font-weight:750;
  text-align:center;
}
.global-total strong{
  font-size:22px;
  color:#6389a2;
}

/* 抱き合わせチェック */
.bundle-check{
  display:flex;
  align-items:center;
  gap:8px;
  background:#f7f9fb;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  margin:8px 0;
}
.bundle-check input{
  width:18px;
  height:18px;
  margin:0;
  accent-color:#6389a2;
}
.bundle-check label{margin:0;font-size:13px}
.bundle-mark{
  color:#d49a38;
  font-size:19px;
  font-weight:800;
  line-height:1;
}
.item-bundle{color:#d49a38;font-size:16px;margin-left:5px}

/* トリミング */
.cropbox{
  position:relative;
  width:min(100%,340px);
  aspect-ratio:1;
  margin:12px auto;
  background:#e9edf0;
  overflow:hidden;
  border-radius:10px;
}
.cropbox canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}
.cropcontrols{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.cropcontrols label{font-size:12px}
.cropcontrols input{width:100%}

/* スクショ画面 */
#shotResult{
  padding:10px;
  background:white;
  --shot-gap:6px;
  --shot-font:10px;
  --shot-count:12px;
  --shot-space:13px;
}
.shot-title{
  text-align:center;
  font-size:17px;
  font-weight:800;
  margin:2px 0 13px;
  overflow-wrap:anywhere;
}
.shot-character{
  margin:0 0 var(--shot-space);
  padding:0 0 10px;
  border-bottom:1px solid #dfe5e9;
}
.shot-character:last-child{border-bottom:0;margin-bottom:0}
.shot-character-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:0 0 8px;
}
.shot-character-heading h3{
  font-size:14px;
  margin:0;
  overflow-wrap:anywhere;
}
.shot-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:var(--shot-gap);
}
.shot-card{
  min-width:0;
  border:0;
  border-radius:7px;
  padding:2px;
  text-align:center;
  background:white;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* 写真は正方形で統一 */
.shot-card img{
  display:block;
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:5px;
  background:#f1f3f5;
}
.shot-card .edition{
  font-size:var(--shot-font);
  line-height:1.2;
  margin-top:3px;
  overflow-wrap:anywhere;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  height:2.4em;
  min-height:2.4em;
}
.shot-card .count{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:var(--shot-count);
  line-height:1.2;
  font-weight:750;
  color:#6389a2;
  margin-top:auto;
  min-height:1.5em;
}
.shot-star{
  position:absolute;
  top:4px;
  right:5px;
  z-index:2;
  color:#e3a52e;
  font-size:18px;
  line-height:1;
  text-shadow:0 1px 3px #fff,0 0 4px #fff;
  pointer-events:none;
}
.shot-total{
  text-align:center;
  font-size:15px;
  font-weight:800;
  background:#edf5fa;
  border-radius:10px;
  padding:11px;
  margin-top:10px;
}
.shot-global-total{
  text-align:center;
  font-size:11px;
  color:#6389a2;
  font-weight:700;
  margin-top:7px;
}
.shot-empty{
  text-align:center;
  color:#89949d;
  padding:25px 8px;
  font-size:13px;
}

@media(max-width:360px){
  main{padding:9px}
  #shotResult{padding:7px}
  .shot-grid{gap:3px}
}

/* スクショ時 */
@media print{
  header,.no-print{display:none!important}
  body{background:white}
  main{padding:0}
  #shotPage{display:block!important}
  #shotResult{border:0;padding:5px}
}
</style>
</head>

<body>

<header>
  <h1>あんスタ ぱしゃっつ管理</h1>
  <div class="muted">事務所・ユニット・キャラクター別に管理</div>
</header>

<main>

<nav class="no-print" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">
  <button style="flex:1" onclick="showPage('manage')">グッズ管理</button>
  <button style="flex:1" onclick="showPage('shot')">スクショ表示</button>
  <button style="flex:1" onclick="showPage('backup')">バックアップ</button>
</nav>

<div id="notice" class="muted">読み込み中…</div>

<section id="managePage">

  <div class="global-total" id="manageGlobalTotal">
    全体の迷子合計：<strong>0</strong>枚
  </div>

  <div class="panel">
    <h2>事務所</h2>
    <div id="officeList"></div>
    <div class="actions">
      <button onclick="addOffice()">＋ 事務所を追加</button>
    </div>
  </div>

  <div class="panel hidden" id="unitPanel">
    <h2 id="unitHeading">ユニット</h2>
    <div id="unitList"></div>
    <div class="actions">
      <button onclick="addUnit()">＋ ユニットを追加</button>
      <button class="sub" onclick="closePanel('unitPanel')">閉じる</button>
    </div>
  </div>

  <div class="panel hidden" id="characterPanel">
    <h2 id="characterHeading">キャラクター</h2>
    <div id="characterList"></div>
    <div class="actions">
      <button onclick="addCharacter()">＋ キャラクターを追加</button>
      <button class="sub" onclick="closePanel('characterPanel')">閉じる</button>
    </div>
  </div>

  <div class="panel hidden" id="goodsPanel">
    <h2 id="goodsHeading">ぱしゃっつ</h2>
    <div id="goodsList"></div>
    <div class="actions">
      <button onclick="addGoods()">＋ ぱしゃっつを追加</button>
      <button class="sub" onclick="closePanel('goodsPanel')">閉じる</button>
    </div>
  </div>

</section>

<!-- スクショ画面 -->
<section id="shotPage" class="hidden">

  <div class="panel no-print shot-settings">
    <h2>ユニット別スクショ</h2>

    <label>事務所</label>
    <select id="shotOffice" onchange="loadShotUnits()"></select>

    <label>ユニット</label>
    <select id="shotUnit" onchange="renderShot()"></select>

    <label>弾で絞り込み</label>
    <select id="shotEdition" onchange="renderShot()">
      <option value="__all__">すべて表示</option>
    </select>

    <p class="muted">
      ユニットと弾を選択すると、該当するグッズだけが表示されるよ。
      表示された画面をスクリーンショットしてね。
    </p>
  </div>

  <div class="panel" id="shotResult">
    <p class="muted">事務所とユニットを選択してね。</p>
  </div>

</section>

<!-- バックアップ -->
<section id="backupPage" class="hidden">
  <div class="panel">
    <h2>バックアップ・復元</h2>

    <p class="muted">
      写真・枚数・事務所などをまとめて保存するよ。
      定期的にバックアップしてね。
    </p>

    <div class="actions">
      <button onclick="exportBackup()">バックアップを保存</button>
    </div>

    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">

    <label>バックアップファイルから復元</label>
    <input type="file" id="backupFile" accept=".json,application/json">

    <button class="sub" onclick="importBackup()">復元する</button>

    <p class="muted">
      復元すると現在のデータはバックアップ内容に置き換わるよ。
    </p>
  </div>
</section>

</main>

<!-- トリミング画面 -->
<div id="cropModal" class="hidden"
style="position:fixed;inset:0;background:#0009;z-index:20;overflow:auto;padding:18px">

  <div class="panel" style="max-width:420px;margin:20px auto">
    <h2>写真をトリミング</h2>
    <p class="muted">写真をドラッグして位置を調整。拡大・縮小もできるよ。</p>

    <div class="cropbox">
      <canvas id="cropCanvas" width="600" height="600"></canvas>
    </div>

    <div class="cropcontrols">
      <label>
        拡大・縮小
        <input id="cropZoom" type="range" min="1" max="3" step=".01" value="1">
      </label>
      <label>
        明るさ
        <input id="cropBright" type="range" min="60" max="140" value="100">
      </label>
    </div>

    <div class="actions">
      <button onclick="saveCroppedImage()">この写真で登録</button>
      <button class="sub" onclick="cancelCrop()">キャンセル</button>
    </div>
  </div>
</div>

<script>
const DB_NAME="PashatsManagerDB";
const STORE="appData";

let db;
let data={offices:[],customEditions:[]};

let selectedOffice=null;
let selectedUnit=null;
let selectedCharacter=null;

let cropImage=null;
let cropTarget=null;
let cropX=0;
let cropY=0;
let dragX=0;
let dragY=0;
let dragging=false;

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

const editions=[
  ["Vol.1",[]],
  ["Vol.2",[]],
  ["7周年",[]],
  ["SHUFFLE",[]],
  ["Vol.3",[]],
  ["COVER SONG",[]],
  ["Vol.4",[]],
  ["Vol.5",[]],
  ["Vol.6",[]],
  ["debut collection",[]],
  ["debut collection-2",[]],
  ["10 UNIT SONG",[]],
  ["Vol.7",[]],
  ["その他",[]]
];

/*
  既存データを削除する移行処理は行わない。
  Private / Action などの既存登録もそのまま保持する。
*/

/* データベース */
function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

function save(){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(data,"main");

    tx.oncomplete=()=>{
      $("notice").textContent="保存しました ✓";
      updateGlobalTotal();
      resolve();
    };
    tx.onerror=()=>reject(tx.error);
  });
}

function load(){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(STORE).objectStore(STORE).get("main");
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

/* 全体の迷子枚数 */
function getGlobalTotal(){
  let total=0;
  data.offices.forEach(o=>{
    (o.units||[]).forEach(u=>{
      (u.characters||[]).forEach(c=>{
        (c.cards||[]).forEach(card=>{
          total+=Number(card.count)||0;
        });
      });
    });
  });
  return total;
}

function updateGlobalTotal(){
  const total=getGlobalTotal();
  $("manageGlobalTotal").innerHTML=
    `全体の迷子合計：<strong>${total}</strong>枚`;
}

/* 選択データ */
function office(){
  return data.offices.find(x=>x.id===selectedOffice);
}
function unit(){
  return office()?.units.find(x=>x.id===selectedUnit);
}
function character(){
  return unit()?.characters.find(x=>x.id===selectedCharacter);
}

/* 画面切り替え */
function showPage(p){
  ["manage","shot","backup"].forEach(x=>{
    $(x+"Page").classList.toggle("hidden",x!==p);
  });
  if(p==="shot")initShot();
}

function closePanel(id){
  $(id).classList.add("hidden");
}

/* 事務所追加 */
function addOffice(){
  const n=prompt("事務所名を入力してね");
  if(!n?.trim())return;

  data.offices.push({id:uid(),name:n.trim(),units:[]});
  save().then(renderOffices);
}

/* ユニット追加 */
function addUnit(){
  const n=prompt("ユニット名を入力してね");
  if(!n?.trim())return;

  office().units.push({id:uid(),name:n.trim(),characters:[]});
  save().then(renderUnits);
}

/* キャラクター追加 */
function addCharacter(){
  const n=prompt("キャラクター名を入力してね");
  if(!n?.trim())return;

  unit().characters.push({id:uid(),name:n.trim(),cards:[]});
  save().then(renderCharacters);
}

/* 名前変更 */
function renameItem(t,id){
  let a=
    t==="office"
    ?data.offices.find(x=>x.id===id)
    :t==="unit"
    ?office().units.find(x=>x.id===id)
    :unit().characters.find(x=>x.id===id);

  if(!a)return;

  const n=prompt("新しい名前",a.name);
  if(n?.trim()){
    a.name=n.trim();
    save().then(renderAll);
  }
}

/* 削除 */
function deleteItem(t,id){
  if(!confirm("この項目と中の登録内容を削除する？"))return;

  if(t==="office")data.offices=data.offices.filter(x=>x.id!==id);
  if(t==="unit")office().units=office().units.filter(x=>x.id!==id);
  if(t==="character")unit().characters=unit().characters.filter(x=>x.id!==id);

  if(t==="office")selectedOffice=selectedUnit=selectedCharacter=null;
  if(t==="unit")selectedUnit=selectedCharacter=null;
  if(t==="character")selectedCharacter=null;

  save().then(renderAll);
}

/* 事務所表示 */
function renderOffices(){
  $("officeList").innerHTML=data.offices.length
  ?data.offices.map(o=>`
    <div class="item">
      <div class="item-title">${esc(o.name)}</div>
      <div class="actions">
        <button class="small" onclick="selectOffice('${o.id}')">ユニットを見る</button>
        <button class="small sub" onclick="renameItem('office','${o.id}')">名前変更</button>
        <button class="small danger" onclick="deleteItem('office','${o.id}')">削除</button>
      </div>
    </div>
  `).join("")
  :"<p class='muted'>事務所を追加してね。</p>";
}

function selectOffice(id){
  selectedOffice=id;
  selectedUnit=selectedCharacter=null;

  $("unitPanel").classList.remove("hidden");
  $("characterPanel").classList.add("hidden");
  $("goodsPanel").classList.add("hidden");

  renderUnits();
}

/* ユニット表示 */
function renderUnits(){
  const o=office();
  if(!o)return;

  $("unitHeading").textContent=o.name+" / ユニット";
  $("unitList").innerHTML=o.units.length
  ?o.units.map(u=>`
    <div class="item">
      <div class="item-title">${esc(u.name)}</div>
      <div class="actions">
        <button class="small" onclick="selectUnit('${u.id}')">キャラクターを見る</button>
        <button class="small sub" onclick="renameItem('unit','${u.id}')">名前変更</button>
        <button class="small danger" onclick="deleteItem('unit','${u.id}')">削除</button>
      </div>
    </div>
  `).join("")
  :"<p class='muted'>ユニットを追加してね。</p>";
}

function selectUnit(id){
  selectedUnit=id;
  selectedCharacter=null;

  $("characterPanel").classList.remove("hidden");
  $("goodsPanel").classList.add("hidden");

  renderCharacters();
}

/* キャラクター表示 */
function renderCharacters(){
  const u=unit();
  if(!u)return;

  $("characterHeading").textContent=u.name+" / キャラクター";
  $("characterList").innerHTML=u.characters.length
  ?u.characters.map(c=>`
    <div class="item">
      <div class="item-title">${esc(c.name)}</div>
      <div class="muted">${c.cards.length}種類登録</div>
      <div class="actions">
        <button class="small" onclick="selectCharacter('${c.id}')">ぱしゃっつを見る</button>
        <button class="small sub" onclick="renameItem('character','${c.id}')">名前変更</button>
        <button class="small danger" onclick="deleteItem('character','${c.id}')">削除</button>
      </div>
    </div>
  `).join("")
  :"<p class='muted'>キャラクターを追加してね。</p>";
}

function selectCharacter(id){
  selectedCharacter=id;
  $("goodsPanel").classList.remove("hidden");
  renderGoods();
}

/* 種類選択 */
function options(){
  let a=editions.map(([n])=>({value:n,label:n}));

  (data.customEditions||[]).forEach(x=>{
    if(!a.some(y=>y.value===x))a.push({value:x,label:x});
  });

  return a;
}

function rank(s){
  const i=options().findIndex(x=>x.value===s);
  return i<0?999:i;
}

/* ぱしゃっつ一覧 */
function renderGoods(){
  const c=character();
  if(!c)return;

  $("goodsHeading").textContent=c.name+" / ぱしゃっつ";

  $("goodsList").innerHTML=c.cards.length
  ?[...c.cards].sort((a,b)=>rank(a.edition)-rank(b.edition)).map(x=>`
    <div class="item" style="display:flex;gap:10px;align-items:center">
      <img src="${x.image}"
      style="width:65px;height:65px;object-fit:cover;border-radius:7px">

      <div style="flex:1;min-width:0">
        <div class="item-title">
          ${esc(x.edition)}
          ${x.bundle?'<span class="item-bundle">☆</span>':""}
        </div>
        <div class="muted">迷子枚数：${Number(x.count)||0}枚</div>
        <div class="actions">
          <button class="small sub" onclick="editCard('${x.id}')">編集</button>
          <button class="small danger" onclick="deleteCard('${x.id}')">削除</button>
        </div>
      </div>
    </div>
  `).join("")
  :"<p class='muted'>まだ登録がないよ。下のボタンから追加してね。</p>";
}

/* 追加フォーム */
function addGoods(){
  const wrap=document.createElement("div");
  wrap.className="panel";

  wrap.innerHTML=`
    <h3>ぱしゃっつを登録</h3>

    <label>種類</label>
    <select id="ed">
      ${options().map(x=>`
        <option value="${esc(x.value)}">${esc(x.label)}</option>
      `).join("")}
    </select>

    <div id="otherBox" class="hidden">
      <label>その他の種類名</label>
      <input id="otherName" type="text" placeholder="例：8周年">
    </div>

    <label>迷子枚数</label>
    <input id="cnt" type="number" min="0" value="1">

    <div class="bundle-check">
      <input id="bundle" type="checkbox">
      <label for="bundle">☆ 抱き合わせ対象にする</label>
    </div>

    <label>写真</label>
    <input id="photo" type="file" accept="image/*">

    <div class="actions">
      <button id="goCrop">写真を選んでトリミング</button>
      <button class="sub" id="cancelAdd">キャンセル</button>
    </div>
  `;

  $("goodsList").prepend(wrap);

  const sel=wrap.querySelector("#ed");

  sel.onchange=()=>{
    wrap.querySelector("#otherBox").classList.toggle("hidden",sel.value!=="その他");
  };

  wrap.querySelector("#cancelAdd").onclick=()=>wrap.remove();

  wrap.querySelector("#goCrop").onclick=()=>{
    const f=wrap.querySelector("#photo").files[0];

    if(!f){
      alert("写真を選んでね");
      return;
    }

    let ed=sel.value;

    if(ed==="その他"){
      ed=wrap.querySelector("#otherName").value.trim();

      if(!ed){
        alert("種類名を入力してね");
        return;
      }

      if(!data.customEditions.includes(ed))data.customEditions.push(ed);
    }

    cropTarget={
      wrap,
      edition:ed,
      count:Math.max(0,parseInt(wrap.querySelector("#cnt").value)||0),
      bundle:wrap.querySelector("#bundle").checked
    };

    openCrop(f);
  };
}

/* トリミング */
function openCrop(file){
  const reader=new FileReader();

  reader.onload=()=>{
    const img=new Image();

    img.onload=()=>{
      cropImage=img;
      cropX=0;
      cropY=0;

      $("cropZoom").value=1;
      $("cropBright").value=100;
      $("cropModal").classList.remove("hidden");

      drawCrop();
    };

    img.onerror=()=>alert("この写真を読み込めなかったよ。別の画像で試してね。");
    img.src=reader.result;
  };

  reader.onerror=()=>alert("写真ファイルを読み込めなかったよ");
  reader.readAsDataURL(file);
}

function drawCrop(){
  if(!cropImage)return;

  const c=$("cropCanvas");
  const ctx=c.getContext("2d");
  const z=Number($("cropZoom").value);

  const base=600/Math.min(cropImage.width,cropImage.height);
  const w=cropImage.width*base*z;
  const h=cropImage.height*base*z;

  ctx.clearRect(0,0,600,600);
  ctx.filter="brightness("+$("cropBright").value+"%)";
  ctx.drawImage(cropImage,(600-w)/2+cropX,(600-h)/2+cropY,w,h);
  ctx.filter="none";
}

$("cropZoom").oninput=drawCrop;
$("cropBright").oninput=drawCrop;

$("cropCanvas").addEventListener("pointerdown",e=>{
  dragging=true;
  dragX=e.clientX;
  dragY=e.clientY;
  $("cropCanvas").setPointerCapture(e.pointerId);
});

$("cropCanvas").addEventListener("pointermove",e=>{
  if(!dragging)return;

  const r=$("cropCanvas").getBoundingClientRect();

  cropX+=(e.clientX-dragX)*600/r.width;
  cropY+=(e.clientY-dragY)*600/r.height;

  dragX=e.clientX;
  dragY=e.clientY;

  drawCrop();
});

$("cropCanvas").addEventListener("pointerup",()=>dragging=false);
$("cropCanvas").addEventListener("pointercancel",()=>dragging=false);

function cancelCrop(){
  $("cropModal").classList.add("hidden");
  cropImage=null;
  cropTarget=null;
}

/* 写真保存 */
async function saveCroppedImage(){
  if(!cropImage||!cropTarget)return;

  const c=$("cropCanvas");
  const small=document.createElement("canvas");
  small.width=450;
  small.height=450;

  small.getContext("2d").drawImage(c,0,0,600,600,0,0,450,450);

  const image=small.toDataURL("image/jpeg",.78);
  const ch=character();

  ch.cards.push({
    id:uid(),
    edition:cropTarget.edition,
    count:cropTarget.count,
    image,
    bundle:cropTarget.bundle
  });

  try{
    await save();
    cropTarget.wrap.remove();
    cancelCrop();
    renderGoods();
  }catch(e){
    alert("保存できなかったよ。写真を小さくして再度試してね。");
  }
}

/* 編集 */
function editCard(id){
  const c=character();
  const x=c.cards.find(a=>a.id===id);
  if(!x)return;

  const n=prompt("迷子枚数",x.count);
  if(n===null)return;

  x.count=Math.max(0,parseInt(n)||0);

  const e=prompt("種類名（変更しない場合はそのまま）",x.edition);
  if(e?.trim())x.edition=e.trim();

  x.bundle=confirm("抱き合わせ対象にする場合はOK、☆を外す場合はキャンセルを押してね。");

  save().then(()=>{
    renderGoods();
    renderShot();
  });
}

/* 削除 */
function deleteCard(id){
  if(!confirm("このぱしゃっつを削除する？"))return;

  character().cards=character().cards.filter(x=>x.id!==id);

  save().then(()=>{
    renderGoods();
    renderShot();
  });
}

/* スクショ画面 */
function initShot(){
  const oldOffice=$("shotOffice").value;

  $("shotOffice").innerHTML=data.offices.map(o=>`
    <option value="${o.id}">${esc(o.name)}</option>
  `).join("");

  if(data.offices.some(o=>o.id===oldOffice))$("shotOffice").value=oldOffice;

  loadShotUnits();
}

function loadShotUnits(){
  const o=data.offices.find(x=>x.id===$("shotOffice").value);
  const oldUnit=$("shotUnit").value;

  $("shotUnit").innerHTML=(o?.units||[]).map(u=>`
    <option value="${u.id}">${esc(u.name)}</option>
  `).join("");

  if((o?.units||[]).some(u=>u.id===oldUnit))$("shotUnit").value=oldUnit;

  updateShotEditionOptions();
  renderShot();
}

/* 弾の絞り込み */
function updateShotEditionOptions(){
  const select=$("shotEdition");
  const oldValue=select.value;
  const all=options();

  select.innerHTML=`
    <option value="__all__">すべて表示</option>
    ${all.filter(x=>x.value!=="その他").map(x=>`
      <option value="${esc(x.value)}">${esc(x.label)}</option>
    `).join("")}
  `;

  if(all.some(x=>x.value===oldValue))select.value=oldValue;
  else select.value="__all__";
}

/* スクショ表示 */
function renderShot(){
  const o=data.offices.find(x=>x.id===$("shotOffice").value);
  const u=o?.units.find(x=>x.id===$("shotUnit").value);
  const el=$("shotResult");

  if(!u){
    el.innerHTML="<div class='shot-empty'>ユニットを選択してね。</div>";
    return;
  }

  let total=0;
  const selectedEdition=$("shotEdition").value;

  const characterData=u.characters.map(c=>{
    const cards=[...(c.cards||[])]
      .filter(x=>(Number(x.count)||0)>0)
      .filter(x=>selectedEdition==="__all__"||x.edition===selectedEdition)
      .sort((a,b)=>rank(a.edition)-rank(b.edition));

    const sub=cards.reduce((s,x)=>s+(Number(x.count)||0),0);

    return{name:c.name,cards,sub};
  }).filter(c=>c.cards.length>0);

  let html=`<div class="shot-title">${esc(u.name)}</div>`;

  characterData.forEach(c=>{
    total+=c.sub;

    html+=`
      <div class="shot-character">
        <div class="shot-character-heading">
          <h3>${esc(c.name)}</h3>
          <span class="tag">${c.sub}枚</span>
        </div>

        <div class="shot-grid">
          ${c.cards.map(x=>`
            <div class="shot-card">
              ${x.bundle?'<span class="shot-star">☆</span>':""}
              <img src="${x.image}" alt="">
              <div class="edition">${esc(x.edition)}</div>
              <div class="count">${Number(x.count)||0}枚</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  });

  if(!characterData.length){
    html+=`<div class="shot-empty">この条件で表示できるグッズはまだないよ。</div>`;
  }

  html+=`
    <div class="shot-total">ユニット合計：${total}枚</div>
    <div class="shot-global-total">全体の迷子合計：${getGlobalTotal()}枚</div>
  `;

  el.innerHTML=html;
}

/* バックアップ */
function exportBackup(){
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="ぱしゃっつ管理バックアップ.json";
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* 復元 */
async function importBackup(){
  const f=$("backupFile").files[0];

  if(!f){
    alert("バックアップファイルを選んでね");
    return;
  }

  if(!confirm("現在のデータを置き換えて復元するよ。続ける？"))return;

  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.offices))throw 0;

    data=d;
    data.customEditions=data.customEditions||[];

    data.offices.forEach(o=>{
      o.units||=[];
      o.units.forEach(u=>{
        u.characters||=[];
        u.characters.forEach(c=>c.cards||=[]);
      });
    });

    await save();
    renderAll();
    alert("復元したよ！");
  }catch(e){
    alert("ファイルを読み込めなかったよ");
  }
}

/* 全画面更新 */
function renderAll(){
  renderOffices();
  updateGlobalTotal();

  if(selectedOffice&&office())renderUnits();
  if(selectedUnit&&unit())renderCharacters();
  if(selectedCharacter&&character())renderGoods();
}

/* 起動・既存データ引き継ぎ */
(async()=>{
  try{
    db=await openDB();

    const old=await load();

    if(old&&Array.isArray(old.offices))data=old;

    data.customEditions=data.customEditions||[];

    data.offices.forEach(o=>{
      o.units||=[];

      o.units.forEach(u=>{
        u.characters||=[];

        u.characters.forEach(c=>{
          c.cards||=[];

          c.cards.forEach(card=>{
            if(typeof card.bundle!=="boolean")card.bundle=false;
          });
        });
      });
    });

    renderAll();

    $("notice").textContent="準備OK！前の登録データを引き継いだよ。";

  }catch(e){
    $("notice").textContent="保存機能を開始できなかったよ。Safariで開き直してね。";
    console.error(e);
  }
})();
