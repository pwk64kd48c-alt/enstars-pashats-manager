<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あんスタ ぱしゃっつ管理</title>
<style>
:root{
  --blue:#b9d5e8;
  --pale:#edf5fa;
  --gray:#f5f6f7;
  --line:#e1e5e9;
  --text:#414a52;
  --dark:#709bb8;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#f7f9fb;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}
header{
  background:white;
  padding:20px 16px 14px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:5;
}
h1{font-size:20px;margin:0 0 5px}
header p{font-size:12px;color:#89949d;margin:0}
main{max-width:850px;margin:auto;padding:15px}
.panel{
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:14px 0 8px}
button,select,input{
  font:inherit;
}
button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:var(--blue);
  color:#304b5c;
  font-weight:600;
  cursor:pointer;
}
button.sub{background:#eef1f3;color:#59636b}
button.danger{background:#f8e9e9;color:#a45c5c}
button.small{font-size:12px;padding:7px 9px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
select,input[type=text],input[type=number]{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px;
  background:white;
  color:var(--text);
  margin:5px 0 10px;
}
input[type=file]{width:100%;margin:8px 0}
label{font-size:13px;font-weight:600}
.muted{font-size:12px;color:#89949d}
.item{
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
  margin:8px 0;
  background:#fff;
}
.item-title{font-weight:700}
.tag{
  display:inline-block;
  background:var(--pale);
  border-radius:20px;
  padding:4px 9px;
  font-size:11px;
  margin:3px;
}
.hidden{display:none!important}
.cardgrid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
}
.goods{
  min-width:0;
  border:1px solid var(--line);
  border-radius:9px;
  padding:5px;
  background:white;
  text-align:center;
}
.goods img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:6px;
  background:#f1f3f5;
}
.goods .edition{
  font-size:11px;
  font-weight:700;
  margin-top:5px;
  overflow-wrap:anywhere;
}
.goods .count{
  font-size:12px;
  color:#6389a2;
  font-weight:700;
  margin-top:3px;
}
.goods button{margin-top:5px}
.character-block{
  margin:12px 0 18px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.total{
  background:var(--pale);
  border-radius:9px;
  padding:10px;
  font-weight:700;
  margin:10px 0;
}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
nav button{flex:1;min-width:100px}
#notice{font-size:12px;color:#66869b;margin:8px 0}
@media(max-width:360px){
  .cardgrid{gap:5px}
  .goods{padding:3px}
  .goods .edition{font-size:10px}
}
@media print{
  header,.no-print,.goods button{display:none!important}
  body{background:white}
  main{padding:0;max-width:none}
  .panel{border:0;padding:5px}
}
</style>
</head>
<body>

<header>
  <h1>あんスタ ぱしゃっつ管理</h1>
  <p>事務所・ユニット・キャラクター別に管理</p>
</header>

<main>
  <nav class="no-print">
    <button onclick="showPage('manage')">グッズ管理</button>
    <button onclick="showPage('shot')">スクショ表示</button>
    <button onclick="showPage('backup')">バックアップ</button>
  </nav>

  <div id="notice">データを読み込み中…</div>

  <section id="managePage">
    <div class="panel">
      <h2>事務所</h2>
      <div id="officeList"></div>
      <div class="actions">
        <button onclick="addOffice()">＋ 事務所を追加</button>
      </div>
    </div>
    <div class="panel hidden" id="unitPanel">
      <h2 id="unitHeading">ユニット</h2>
      <div id="unitList"></div>
      <div class="actions">
        <button onclick="addUnit()">＋ ユニットを追加</button>
        <button class="sub" onclick="closeUnits()">閉じる</button>
      </div>
    </div>
    <div class="panel hidden" id="characterPanel">
      <h2 id="characterHeading">キャラクター</h2>
      <div id="characterList"></div>
      <div class="actions">
        <button onclick="addCharacter()">＋ キャラクターを追加</button>
        <button class="sub" onclick="closeCharacters()">閉じる</button>
      </div>
    </div>
    <div class="panel hidden" id="goodsPanel">
      <h2 id="goodsHeading">ぱしゃっつ</h2>
      <div id="goodsList"></div>
      <div class="actions">
        <button onclick="addGoods()">＋ ぱしゃっつを追加</button>
        <button class="sub" onclick="closeGoods()">閉じる</button>
      </div>
    </div>
  </section>

  <section id="shotPage" class="hidden">
    <div class="panel no-print">
      <h2>スクショ表示</h2>
      <label>事務所</label>
      <select id="shotOffice" onchange="loadShotUnits()"></select>
      <label>ユニット</label>
      <select id="shotUnit" onchange="renderShot()"></select>
      <div class="actions">
        <button onclick="window.print()">印刷・PDF保存</button>
      </div>
      <p class="muted">スマホではこの画面をそのままスクリーンショットしてね。</p>
    </div>
    <div class="panel" id="shotResult">
      <p class="muted">事務所とユニットを選択してね。</p>
    </div>
  </section>

  <section id="backupPage" class="hidden">
    <div class="panel">
      <h2>バックアップ・復元</h2>
      <p class="muted">登録した写真・枚数・事務所などをまとめて保存できるよ。機種変更やブラウザのデータ削除の前にバックアップしてね。</p>
      <div class="actions">
        <button onclick="exportBackup()">バックアップを保存</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
      <label>バックアップファイルから復元</label>
      <input type="file" id="backupFile" accept=".json,application/json">
      <button class="sub" onclick="importBackup()">復元する</button>
      <p class="muted">復元すると現在のデータはバックアップ内容に置き換わるよ。</p>
    </div>
  </section>
</main>

<script>
const DB_NAME="PashatsManagerDB";
const STORE="appData";
let db;
let data={offices:[],customEditions:[]};
let selectedOffice=null,selectedUnit=null,selectedCharacter=null;

const editions=[
  {name:"Vol.1",variants:["通常"]},
  {name:"Vol.2",variants:["Private","Action"]},
  {name:"7周年",variants:[""]},
  {name:"SHUFFLE",variants:[""]},
  {name:"Vol.3",variants:["通常"]},
  {name:"COVER SONG",variants:[""]},
  {name:"Vol.4",variants:["通常"]},
  {name:"Vol.5",variants:["通常"]},
  {name:"Vol.6",variants:["Private","Action"]},
  {name:"debut collection",variants:[""]},
  {name:"debut collection-2",variants:[""]},
  {name:"10 UNIT SONG",variants:[""]},
  {name:"Vol.7",variants:["Action"]},
  {name:"その他",variants:[""]}
];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(STORE);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function save(){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(data,"main");
    tx.oncomplete=()=>{document.getElementById("notice").textContent="保存しました ✓";resolve()};
    tx.onerror=()=>reject(tx.error);
  });
}
function load(){
  return new Promise((resolve,reject)=>{
    const req=db.transaction(STORE).objectStore(STORE).get("main");
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function office(){return data.offices.find(x=>x.id===selectedOffice)}
function unit(){return office()?.units.find(x=>x.id===selectedUnit)}
function character(){return unit()?.characters.find(x=>x.id===selectedCharacter)}

function showPage(page){
  ["manage","shot","backup"].forEach(p=>{
    document.getElementById(p+"Page").classList.toggle("hidden",p!==page);
  });
  if(page==="shot")initShot();
}
function addOffice(){
  const name=prompt("事務所名を入力してね");
  if(!name?.trim())return;
  data.offices.push({id:uid(),name:name.trim(),units:[]});
  save().then(renderOffices);
}
function addUnit(){
  const name=prompt("ユニット名を入力してね");
  if(!name?.trim())return;
  office().units.push({id:uid(),name:name.trim(),characters:[]});
  save().then(renderUnits);
}
function addCharacter(){
  const name=prompt("キャラクター名を入力してね");
  if(!name?.trim())return;
  unit().characters.push({id:uid(),name:name.trim(),cards:[]});
  save().then(renderCharacters);
}
function renameItem(type,id){
  let item;
  if(type==="office")item=data.offices.find(x=>x.id===id);
  if(type==="unit")item=office().units.find(x=>x.id===id);
  if(type==="character")item=unit().characters.find(x=>x.id===id);
  if(!item)return;
  const name=prompt("新しい名前",item.name);
  if(name?.trim()){item.name=name.trim();save().then(renderAll)}
}
function deleteItem(type,id){
  if(!confirm("この項目と中の登録内容を削除する？"))return;
  if(type==="office")data.offices=data.offices.filter(x=>x.id!==id);
  if(type==="unit")office().units=office().units.filter(x=>x.id!==id);
  if(type==="character")unit().characters=unit().characters.filter(x=>x.id!==id);
  save().then(()=>{
    if(type==="office"){selectedOffice=null;selectedUnit=null;selectedCharacter=null}
    if(type==="unit"){selectedUnit=null;selectedCharacter=null}
    if(type==="character")selectedCharacter=null;
    renderAll();
  });
}
function renderOffices(){
  const el=document.getElementById("officeList");
  el.innerHTML=data.offices.length?data.offices.map(o=>`
    <div class="item">
      <div class="item-title">${esc(o.name)}</div>
      <div class="actions">
        <button class="small" onclick="selectOffice('${o.id}')">ユニットを見る</button>
        <button class="small sub" onclick="renameItem('office','${o.id}')">名前変更</button>
        <button class="small danger" onclick="deleteItem('office','${o.id}')">削除</button>
      </div>
    </div>`).join(""):"<p class='muted'>事務所を追加してね。</p>";
}
function selectOffice(id){
  selectedOffice=id;selectedUnit=null;selectedCharacter=null;
  document.getElementById("unitPanel").classList.remove("hidden");
  document.getElementById("characterPanel").classList.add("hidden");
  document.getElementById("goodsPanel").classList.add("hidden");
  renderUnits();
}
function renderUnits(){
  const o=office();if(!o)return;
  document.getElementById("unitHeading").textContent=o.name+" / ユニット";
  document.getElementById("unitList").innerHTML=o.units.length?o.units.map(u=>`
    <div class="item">
      <div class="item-title">${esc(u.name)}</div>
      <div class="actions">
        <button class="small" onclick="selectUnit('${u.id}')">キャラクターを見る</button>
        <button class="small sub" onclick="renameItem('unit','${u.id}')">名前変更</button>
        <button class="small danger" onclick="deleteItem('unit','${u.id}')">削除</button>
      </div>
    </div>`).join(""):"<p class='muted'>ユニットを追加してね。</p>";
}
function selectUnit(id){
  selectedUnit=id;selectedCharacter=null;
  document.getElementById("characterPanel").classList.remove("hidden");
  document.getElementById("goodsPanel").classList.add("hidden");
  renderCharacters();
}
function renderCharacters(){
  const u=unit();if(!u)return;
  document.getElementById("characterHeading").textContent=u.name+" / キャラクター";
  document.getElementById("characterList").innerHTML=u.characters.length?u.characters.map(c=>`
    <div class="item">
      <div class="item-title">${esc(c.name)}</div>
      <div class="muted">${c.cards.length}種類登録</div>
      <div class="actions">
        <button class="small" onclick="selectCharacter('${c.id}')">ぱしゃっつを見る</button>
        <button class="small sub" onclick="renameItem('character','${c.id}')">名前変更</button>
        <button class="small danger" onclick="deleteItem('character','${c.id}')">削除</button>
      </div>
    </div>`).join(""):"<p class='muted'>キャラクターを追加してね。</p>";
}
function selectCharacter(id){
  selectedCharacter=id;
  document.getElementById("goodsPanel").classList.remove("hidden");
  renderGoods();
}
function closeUnits(){document.getElementById("unitPanel").classList.add("hidden")}
function closeCharacters(){document.getElementById("characterPanel").classList.add("hidden")}
function closeGoods(){document.getElementById("goodsPanel").classList.add("hidden")}

function editionOptions(){
  let list=[];
  editions.forEach(e=>{
    if(e.name==="その他"){
      list.push({value:"その他",label:"その他"});
    }else if(e.variants.length===1&&e.variants[0]===""){
      list.push({value:e.name,label:e.name});
    }else{
      e.variants.forEach(v=>{
        list.push({value:e.name+"｜"+v,label:e.name+"（"+v+"）"});
      });
    }
  });
  (data.customEditions||[]).forEach(x=>{
    if(!list.some(y=>y.value===x))list.push({value:x,label:x});
  });
  return list;
}
function renderGoods(){
  const c=character();if(!c)return;
  document.getElementById("goodsHeading").textContent=c.name+" / ぱしゃっつ";
  const cards=[...c.cards].sort((a,b)=>editionRank(a.edition)-editionRank(b.edition));
  document.getElementById("goodsList").innerHTML=cards.length?cards.map(card=>`
    <div class="item" style="display:flex;gap:10px;align-items:center">
      <img src="${card.image}" style="width:65px;height:65px;object-fit:cover;border-radius:7px">
      <div style="flex:1;min-width:0">
        <div class="item-title">${esc(card.edition)}</div>
        <div class="muted">迷子枚数：${card.count}枚</div>
        <div class="actions">
          <button class="small sub" onclick="editCard('${card.id}')">編集</button>
          <button class="small danger" onclick="deleteCard('${card.id}')">削除</button>
        </div>
      </div>
    </div>`).join(""):"<p class='muted'>まだ登録がないよ。下のボタンから追加してね。</p>";
}
function editionRank(name){
  const all=editionOptions().map(x=>x.value);
  const i=all.indexOf(name);
  return i<0?999:i;
}
async function compressImage(file){
  const img=await createImageBitmap(file);
  const max=450,scale=Math.min(1,max/Math.max(img.width,img.height));
  const canvas=document.createElement("canvas");
  canvas.width=Math.round(img.width*scale);
  canvas.height=Math.round(img.height*scale);
  canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
  return canvas.toDataURL("image/jpeg",0.76);
}
function addGoods(){
  const c=character();if(!c)return;
  const opts=editionOptions();
  let html=opts.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join("");
  const wrap=document.createElement("div");
  wrap.innerHTML=`
    <div class="panel" style="margin-top:12px">
      <h3>ぱしゃっつを登録</h3>
      <label>種類</label>
      <select id="newEdition">${html}</select>
      <div id="otherBox" class="hidden">
        <label>その他の種類名</label>
        <input id="otherName" type="text" placeholder="例：8周年">
      </div>
      <label>Private / Actionなど</label>
      <p class="muted">Vol.2・Vol.6・Vol.7は種類名に含まれているよ。</p>
      <label>迷子枚数</label>
      <input id="newCount" type="number" min="0" value="1">
      <label>写真</label>
      <input id="newImage" type="file" accept="image/*">
      <div class="actions">
        <button id="saveNewCard">登録する</button>
        <button class="sub" id="cancelNewCard">キャンセル</button>
      </div>
    </div>`;
  document.getElementById("goodsList").prepend(wrap);
  const sel=wrap.querySelector("#newEdition");
  sel.onchange=()=>wrap.querySelector("#otherBox").classList.toggle("hidden",sel.value!=="その他");
  wrap.querySelector("#cancelNewCard").onclick=()=>wrap.remove();
  wrap.querySelector("#saveNewCard").onclick=async()=>{
    const file=wrap.querySelector("#newImage").files[0];
    if(!file){alert("写真を選んでね");return}
    let ed=sel.value;
    if(ed==="その他"){
      ed=wrap.querySelector("#otherName").value.trim();
      if(!ed){alert("種類名を入力してね");return}
      if(!data.customEditions.includes(ed))data.customEditions.push(ed);
    }
    const count=Math.max(0,parseInt(wrap.querySelector("#newCount").value)||0);
    try{
      const image=await compressImage(file);
      c.cards.push({id:uid(),edition:ed,count,image});
      await save();renderGoods();
    }catch(e){alert("写真を読み込めなかったよ。別の写真で試してね。")}
  };
}
function editCard(id){
  const c=character(),card=c.cards.find(x=>x.id===id);if(!card)return;
  const n=prompt("迷子枚数を入力してね",card.count);
  if(n===null)return;
  card.count=Math.max(0,parseInt(n)||0);
  const e=prompt("種類名を変更する場合は入力（変更しない場合はそのまま）",card.edition);
  if(e?.trim())card.edition=e.trim();
  save().then(renderGoods);
}
function deleteCard(id){
  if(!confirm("このぱしゃっつを削除する？"))return;
  character().cards=character().cards.filter(x=>x.id!==id);
  save().then(renderGoods);
}

function initShot(){
  const sel=document.getElementById("shotOffice");
  sel.innerHTML=data.offices.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("");
  loadShotUnits();
}
function loadShotUnits(){
  const o=data.offices.find(x=>x.id===document.getElementById("shotOffice").value);
  const sel=document.getElementById("shotUnit");
  sel.innerHTML=(o?.units||[]).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("");
  renderShot();
}
function renderShot(){
  const o=data.offices.find(x=>x.id===document.getElementById("shotOffice").value);
  const u=o?.units.find(x=>x.id===document.getElementById("shotUnit").value);
  const el=document.getElementById("shotResult");
  if(!u){el.innerHTML="<p class='muted'>ユニットを選択してね。</p>";return}
  let total=0,html=`<h2>${esc(u.name)}</h2>`;
  u.characters.forEach(c=>{
    const cards=[...c.cards].filter(x=>x.count>0).sort((a,b)=>editionRank(a.edition)-editionRank(b.edition));
    const sub=cards.reduce((s,x)=>s+x.count,0);
    total+=sub;
    if(!cards.length)return;
    html+=`<div class="character-block">
      <h3>${esc(c.name)} <span class="tag">${sub}枚</span></h3>
      <div class="cardgrid">${cards.map(x=>`
        <div class="goods">
          <img src="${x.image}">
          <div class="edition">${esc(x.edition)}</div>
          <div class="count">${x.count}枚</div>
        </div>`).join("")}</div>
    </div>`;
  });
  html+=`<div class="total">ユニット合計：${total}枚</div>`;
  el.innerHTML=html;
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="ぱしゃっつ管理バックアップ.json";a.click();
  URL.revokeObjectURL(url);
}
async function importBackup(){
  const file=document.getElementById("backupFile").files[0];
  if(!file){alert("バックアップファイルを選んでね");return}
  if(!confirm("現在のデータを置き換えて復元するよ。続ける？"))return;
  try{
    const d=JSON.parse(await file.text());
    if(!Array.isArray(d.offices))throw new Error();
    data=d;data.customEditions=data.customEditions||[];
    await save();renderAll();alert("復元したよ！");
  }catch(e){alert("ファイルを読み込めなかったよ。")}
}
function renderAll(){
  renderOffices();
  if(selectedOffice&&office())renderUnits();
  if(selectedUnit&&unit())renderCharacters();
  if(selectedCharacter&&character())renderGoods();
}
(async()=>{
  try{
    db=await openDB();
    const saved=await load();
    if(saved&&Array.isArray(saved.offices))data=saved;
    if(!data.customEditions)data.customEditions=[];
    renderAll();
    document.getElementById("notice").textContent="準備OK！登録を始められるよ。";
  }catch(e){
    document.getElementById("notice").textContent="保存機能を開始できなかったよ。Safariで開き直してね。";
  }
})();
</script>
</body>
</html>
